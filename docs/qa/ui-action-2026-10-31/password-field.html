<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QuickTalk 컴퓨터 제어 테스트 — 비밀번호 필드</title>
<style>
  body { font: 16px -apple-system, BlinkMacSystemFont, sans-serif; margin: 40px; }
  h1 { font-size: 20px; }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  input { width: 320px; padding: 8px 10px; font-size: 15px; }
  p { color: #555; }
</style>
</head>
<body>
  <h1>비밀번호 필드 테스트</h1>
  <p>이 페이지는 Phase 2 의 <strong>보안 필드 거부</strong>(U4) 확인용입니다.</p>

  <label for="user">아이디</label>
  <input id="user" type="text" autocomplete="off" placeholder="일반 텍스트 필드">

  <label for="pass">비밀번호</label>
  <input id="pass" type="password" autocomplete="off" placeholder="보안 텍스트 필드">
</body>
</html>
